setting:
  ref: null
  details: 'The owner''s restaurant after service, at night: a dark wood corner table, warm tungsten light, deep
    shadows. A warm tungsten wall lamp on the left wall at 58% of the height lights the left edge at 50% to 66%.
    Camera about 10 degrees above the table: the table top spans from 70% of the frame height (its far edge, measured
    from the top of the frame) down to the bottom; the wall behind it fills the upper 70%. A half-finished plate
    stands on the table at the left of the phone. A small window at the right edge of the frame at 42% to 62% of
    the height, below the text wall, slightly out of focus, the Tirana clock tower a small lit silhouette in it.'
  background_rule: 'No menus, receipts, signs or readable words anywhere; the walls are plain. The call screen shows
    only the word and the shapes described. A phone with its screen off is plain black glass with a soft lamp reflection
    and nothing else. The surface the props stand on is bare apart from the listed props. The clock tower is a small
    lit silhouette with a plain clock face: no numerals, no letters; the window glass reflects no text; no shop
    signs on the street.'
