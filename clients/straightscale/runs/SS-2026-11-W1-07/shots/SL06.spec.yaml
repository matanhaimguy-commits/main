style: 'Tirana after dark: cinematic night city scenes, warm tungsten light, the Tirana clock tower visible through
  the cover''s window. Same light and colour grade on every slide. Thread: a smartphone in a deep red case (#BE0F18),
  recurring on every slide, changing state with the story. Palette: scene tone near-black (#1F1F1F), type ivory
  (#F8F6EF), accent crimson #B31217 as solid highlight rectangles behind key words and the swipe arrow button, small
  gold (#DD9A10) only for the counter. #B31217 is the only saturated colour besides the gold counter and the phone
  case. Type: heavy bold geometric sans in ivory, left-aligned in the calm dark area; key words in solid crimson
  #B31217 highlight rectangles. Spell ë and ç out letter by letter in every prompt. Frame: slide counter top right
  (gold), swipe arrow bottom right on slides 1 to N-1. Bottom-left corner calm, dark and empty.'
must_not:
- no logo or wordmark drawn anywhere
- no letters or objects in the bottom-left corner
- no readable words on any phone screen except the strings listed in the text block or the props block
- no borders, side bars or blurred margins
