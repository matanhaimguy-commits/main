style: '"Tirana after dark": cinematic night city scenes, warm tungsten light, no window and no clock tower in this
  single image. Same light and colour grade on every slide. Thread: a smartphone in a deep red case (#BE0F18), recurring
  on every slide, changing state with the story (silent, unread messages piling up, ringing, a booked calendar).
  Palette: scene tone near-black (#1F1F1F), type ivory (#F8F6EF), accent crimson #B31217 as solid highlight rectangles
  behind key words; there is no swipe arrow button and no gold in this single image. #B31217 is the only saturated
  colour besides the phone case. Type: heavy bold geometric sans in ivory, left-aligned in the calm dark area; key
  words in solid crimson #B31217 highlight rectangles. Spell ë and ç out letter by letter in every prompt. Frame:
  a single image with no slide counter and no swipe arrow. Bottom-left corner calm, dark and empty.'
must_not:
- no logo or wordmark drawn anywhere
- no letters or objects in the bottom-left corner
- no letters, words, digits or app names on any phone screen; screens hold only the shapes described in the props
  block
- no picture-frame borders, side bars or blurred margins around the whole image
- no window and no clock tower
- no faces or profiles on the people
- no third person
hero: true
notes: 'The card''s hook gate shipped a daytime showroom with a tight crop; this spec follows the locked style bible
  (night look, warm tungsten) with the shop open in the evening and no window. Director to confirm. Prop sheet PS-CHAT
  (state: CHAT-IN-2) is attached as the last reference image.'
