    content: "a modern smartphone in a matte deep red #BE0F18 silicone case: a thin raised red case lip runs evenly round the screen, then a very thin black bezel; the screen is one continuous pure black glass rectangle with evenly rounded corners, all four corners visible and crisp; it carries only one soft, featureless warm sheen across one corner from the window light (no reflected shapes); no notch, island or camera cut-out showing on the screen, no lock screen, no clock, no wallpaper, no icons, no notification, no glow; no logo or writing anywhere on the phone or the case"
    size_in_frame: "about 22% of the frame width and 20% of its height (x 0.52 to 0.74, y 0.66 to 0.86), the whole phone inside the central 4:3 area"
