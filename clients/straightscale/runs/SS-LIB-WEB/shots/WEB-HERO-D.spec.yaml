    pose: "flat on its back on the table, screen up, centre-right (x 0.52 to 0.74, y 0.66 to 0.86); long axis turned about 20 degrees from the table's far edge, its left end a little farther from the camera than its right end, so the whole screen reads as one clear four-cornered shape in perspective"
    expression: ""
