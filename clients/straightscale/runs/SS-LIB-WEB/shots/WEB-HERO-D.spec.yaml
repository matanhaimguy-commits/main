action_physics:
  - "the phone's back lies flat on the tabletop: the case's back rim touches the wood along all four edges, no edge raised, a thin soft contact shadow hugging its outline"
  - "the phone is the only object touching the table: bare wood surrounds it on every side (at least 6% of the frame width of bare wood to its right before the bare corner begins at x 0.80); nothing touches or overlaps the phone"
  - "the tabletop runs unbroken from its far edge at y 0.63 down to the bottom frame edge across the full width: the near foreground and the bare bottom-right corner (x 0.80 to 1.00, y 0.70 to 1.00) are bare wood with the grain and the warm key light continuing evenly into the corner, no object, no cast shadow from anything off frame"
static: true
setting:
  ref: "STYLE-TOP@v1"
  details: "Inside a quiet café in central Tirana at night. TABLE: a dark walnut table runs across the full width of the lower third; its far edge is a straight level line at about y 0.63, a thin strip of dark wall between it and the window's bottom frame; its top fills the frame from there to the bottom edge, bare wood all the way down; real wood grain running left to right, satin finish with soft warm highlights from the window lights. BARE CORNER: the bottom-right of the table (x 0.80 to 1.00, y 0.70 to 1.00) is plain, bare, evenly lit wood running to the bottom and right edges, nothing on it, its grain unbroken. HEADLINE-SAFE WALL: the left 55% above the table (x 0.00 to 0.55, y 0.00 to 0.60) is a plain matte near-black wall, completely empty and calm, falling off into shadow; the wall continues, equally plain, from x 0.55 to the window. WINDOW: one large plate-glass window on the right (x 0.62 to 0.98, y 0.04 to 0.60), a single rectangular opening in a thin dark frame with four straight inner edges, no mullions or bars crossing it, clear glass with no reflections, nothing in front of it. Through it the Tirana clock tower, a slender square stone tower floodlit warm amber with a small pointed roof, standing in the middle of the opening (about x 0.74 to 0.85, its axis near x 0.80, inside the central 4:3 area), with the lit square and facades on both sides of it; its clock faces are softly glowing discs with hands only. Below it the square: warm street lamps and lit cream and ochre facades as soft bokeh, empty of people and cars. LIGHT: warm tungsten from out of frame above right falls on the table and the phone and reaches the bare bottom-right corner of the table; the window adds warm glow; the left wall stays near-black."
  background_rule: "Nothing on the left wall or between it and the window: no lamps, sconces, art, frames, shelves, mirrors, posters, plants or chair backs. Nothing in front of the window opening (no phone, plant, lamp, object or table edge overlaps it), so its glass can be keyed by a four-point polygon. The opening is filled with the night square and the lit tower, never blank or black. No signs, shop names, lettering or readable numerals anywhere (the clock faces show hands only). No people, figures or silhouettes in the room, in the window view or reflected in the glass or the phone. No cup, saucer, drinking glass or other object anywhere, on the table or in the near foreground; no other tables or chairs."
camera:
  framing: "wide establishing still of a window table: the empty dark wall upper left, the window upper right, the table across the lower third running to the bottom edge as bare wood, with the phone centre-right the only object on it; the near foreground and the bottom-right corner are plain table"
  angle: "seated, about 40 cm above the tabletop, looking down at the phone at about 40 degrees below horizontal (the angle the phone box x 0.52 to 0.74, y 0.66 to 0.86 implies), so its whole screen reads as one clear four-cornered shape, as on the approved 15 Oct cover; the window frame and the tower stay vertical"
  lens: "35mm film still: the whole phone in sharp focus from its near end to its far end, all four screen corners crisp; the nearest strip of table at the bottom edge slightly soft, the window view soft bokeh"
  aspect: "16:9"
  safe_zones: "Central 4:3 safe area x 0.125 to 0.875: the phone, its whole screen and the clock tower sit inside it (narrower desktop viewports crop the sides). Headline-safe x 0.00 to 0.55, y 0.00 to 0.60: plain dark wall, nothing in it (the HTML H1, subline and CTA unit sit there over a scrim). The phone at least 10% above the bottom edge. Bare corner x 0.80 to 1.00, y 0.70 to 1.00: bare table only. No logo corner: the site's nav bar carries the real logo."
