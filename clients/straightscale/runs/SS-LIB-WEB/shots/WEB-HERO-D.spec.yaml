format: static
script_lines: [A1-H1]
line_text: "Grow your business. Without guessing what to do next. / Rritni biznesin tuaj. Pa hamendësime për hapat e ardhshëm."
story_purpose: "Desktop master (16:9) of the act 1 hero of straightscale.com (BRIEF beat 1, Recognition): the establishing shot of the page's thread object, the red-case phone, waiting on a café table in Tirana at night, in the world of the brand's Instagram posts. The calm dark left 55% carries the HTML headline. The phone stays in the plate and receives an HTML lock-screen notification mapped with matrix3d to its four screen corners; the window glass is keyed to alpha by polygon so WEB-EXT shows through it. This master contains NO cup: the near parallax plane is the separately generated cup WEB-CUP, composited later over the plain bare table at the bottom-right (the cup spot), so the table there must stay empty wood (BUILD-SPEC act 1)."
must_read_in_1s: "A red phone lies quiet on a café table in Tirana at night"
