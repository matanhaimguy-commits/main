shot_id: WEB-HERO-M
post_id: SS-LIB-WEB
format: static
script_lines: [A1-H1]
line_text: "Grow your business. Without guessing what to do next. / Rritni biznesin tuaj. Pa hamendësime për hapat e ardhshëm."
story_purpose: "Phone master (9:16 portrait) of the act 1 hero of straightscale.com (BRIEF beat 1, Recognition; most visitors arrive on a phone from an ad): the same world as WEB-HERO-D, art-directed so the whole frame is the hero's ground on phones. The calm dark wall at the upper left carries the HTML copy; the red-case phone below is turned toward the camera so its black screen is large enough for the HTML lock-screen notification mapped with matrix3d to its four screen corners; the window glass is keyed to alpha by polygon so WEB-EXT shows through it. This master contains NO cup: the near parallax plane is the separately generated cup WEB-CUP, composited later over the plain bare table at the bottom-right (the cup spot), so the table there must stay empty wood (BUILD-SPEC act 1, mobile art direction)."
must_read_in_1s: "A red phone lies quiet on a café table in Tirana at night"
subjects:
  - id: PR-PHONE
    ref: "STYLE@v1 (design source only, not attached: the phone on the published 15 Oct cover; that asset failed G-VIS-SHEET for its redrawn logo and side bands, so the phone is written out in words here)"
    state: "screen off: black glass with one soft featureless warm sheen; deep red #BE0F18 matte silicone case; lying still"
    pose: "flat on its back on the table, screen up, in portrait orientation to the camera: its bottom end nearest the camera, its top end pointing away toward the wall, long axis turned about 15 degrees to the right of the line of sight; box x 0.15 to 0.70, y 0.62 to 0.86; the screen large, its short side spanning at least 22% of the frame width"
    expression: ""
hands: none visible
props:
  - id: PR-PHONE
    story_critical: true
    ref: "STYLE@v1 (design source only, not attached: failed G-VIS-SHEET for its logo and side bands; no PR-PHONE prop sheet exists)"
    state: "lying flat, screen up, screen off, in the focus plane (the sharpest thing in the frame)"
    content: "a modern smartphone in a matte deep red #BE0F18 silicone case: a thin raised red case lip runs evenly round the screen, then a very thin black bezel; the screen is one continuous pure black glass rectangle with evenly rounded corners, all four corners visible and crisp; it carries only one soft, featureless warm sheen across one corner from the window light (no reflected shapes); no notch content, no lock screen, no clock, no wallpaper, no icons, no notification, no glow; no logo or writing anywhere on the phone or the case"
    size_in_frame: "x 0.15 to 0.70, y 0.62 to 0.86; the screen's short side at least 22% of the frame width; the whole phone inside the frame"
    held_by: null
text_in_image: none
action_physics:
  - "the phone's back lies flat on the tabletop: the case's back rim touches the wood along all four edges, no edge raised, a thin soft contact shadow hugging its outline"
  - "the phone is the only object touching the table: bare wood surrounds it on every side (at least 4% of the frame width between its lower right corner and the cup spot, which begins at x 0.74); nothing touches or overlaps the phone"
  - "the tabletop runs unbroken from its far edge at y 0.58 down to the bottom frame edge across the full width: the near foreground and the bottom-right corner (the cup spot, x 0.74 to 1.00, y 0.80 to 1.00) are bare wood with the grain and the warm key light continuing evenly into the corner, no object, no cast shadow from anything off frame"
static: true
setting:
  ref: "STYLE-TOP@v1"
  details: "The same café as WEB-HERO-D, inside, central Tirana at night. UPPER 55% (y 0.00 to 0.56): a plain matte near-black wall on the left and across the top, completely empty and calm (HEADLINE-SAFE: x 0.00 to 0.53, y 0.00 to 0.56, and the full-width band above the window, y 0.00 to 0.07); the wall continues, equally plain, below the window down to the table. WINDOW: one plate-glass window at the upper right (x 0.55 to 0.95, y 0.08 to 0.42), a single rectangular opening in a thin dark frame with four straight inner edges, no mullions or bars crossing it, clear glass with no reflections, nothing in front of it. Through it, small in the opening, the Tirana clock tower, a slender square stone tower floodlit warm amber with a small pointed roof (about x 0.68 to 0.80, y 0.14 to 0.42), its clock faces softly glowing discs with hands only; below it warm street lamps and lit cream and ochre facades as soft bokeh, empty of people and cars. TABLE: a dark walnut table fills the lower 40%: its far edge is a straight level line at about y 0.58, its top runs to the bottom edge, bare wood all the way down; real wood grain running left to right, satin finish with soft warm highlights. CUP SPOT: the bottom-right of the table (x 0.74 to 1.00, y 0.80 to 1.00) is plain, bare, evenly lit wood running to the bottom and right edges, nothing on it, its grain unbroken; the separate WEB-CUP layer is composited over it later. LIGHT: warm tungsten from out of frame above right falls on the table and the phone and reaches the bare bottom-right corner of the table; the window adds warm glow; the wall stays near-black."
  background_rule: "Nothing on the wall: no lamps, sconces, art, frames, shelves, mirrors, posters, plants or chair backs. Nothing in front of the window opening (no phone, plant, lamp, object or table edge overlaps it), so its glass can be keyed by a four-point polygon. The opening is filled with the night square and the lit tower, never blank or black. No signs, shop names, lettering or readable numerals anywhere (the clock faces show hands only). No people, figures or silhouettes in the room, in the window view or reflected in the glass or the phone. No cup, saucer, glass or other object anywhere, on the table or in the near foreground; no other tables or chairs."
camera:
  framing: "tall portrait still of a window table: the empty dark wall upper left, the small lit window upper right, the table across the lower 40% running to the bottom edge as bare wood, with the phone large, turned toward the camera and the only object on it; the near foreground and the bottom-right corner are plain table"
  angle: "seated, about 45 cm above the tabletop, tilted down a little more than WEB-HERO-D so the phone's screen reads large; the window frame and the tower stay vertical"
  lens: "35mm film still, about f/2: focus on the phone; the nearest strip of table at the bottom edge slightly soft, the window view soft bokeh"
  aspect: "9:16"
  safe_zones: "Headline-safe x 0.00 to 0.53, y 0.00 to 0.56 plus the band y 0.00 to 0.07 across the full width: plain dark wall, nothing in it (the HTML eyebrow, H1, subline and CTA sit over the left and upper area). The phone and its whole screen fully inside the frame, at least 5% from the left edge and above y 0.88 (the proof ribbon and the sticky CTA cover the bottom 12% on phones). Cup spot x 0.74 to 1.00, y 0.80 to 1.00: bare table only, reserved for the composited WEB-CUP layer. No logo corner: the site's nav bar carries the real logo."
continuity:
  previous_shot: WEB-HERO-D
  carry_over:
    - "the same café, wall, window, tower, table and phone as WEB-HERO-D, re-composed for portrait"
    - "the same light, grade and grain (STYLE-TOP@v1)"
    - "the phone screen off, black glass; no cup in the master, the bottom-right bare table reserved for the WEB-CUP layer, as in WEB-HERO-D"
