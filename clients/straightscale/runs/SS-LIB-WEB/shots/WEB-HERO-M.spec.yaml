style: "photorealistic cinematic 35mm film still, shallow depth of field, fine film grain; Tirana after dark (style-bible.md): warm tungsten light, deep shadows, near-black scene tone around #1F1F1F; deep red #BE0F18 (the phone case) the only saturated colour besides the warm light; same light and grade as STYLE-TOP@v1 (owner-approved look, G-HUMAN-LOOK)"
must_not:
  - "no people, faces, figures, silhouettes or body parts anywhere, including the window view and any reflection in the phone glass or the window"
  - "no hands or fingers"
  - "no text, letters, numbers or signage on the wall, the window glass, the tower, the facades, the table or the phone (all words on this page are HTML)"
  - "no readable numerals on the clock faces"
  - "no logos or brand marks: none on the phone or case, and no StraightScale mark drawn in any corner (FL-13)"
  - "no screen content on the phone: no lock screen, clock, wallpaper, icons, notification, UI or glow"
  - "no cup of any kind (espresso cup, coffee cup, mug), no saucer, glass, spoon, plate, laptop, notebook, menu or any other object on the table, in the near foreground or at the bottom edge; no second phone"
  - "nothing in the cup spot (x 0.74 to 1.00, y 0.80 to 1.00): bare wood only, no object, no blurred foreground shape, no cast shadow from anything off frame"
  - "nothing on the wall in the headline-safe area: no lamp, sconce, art, frame, shelf, mirror, poster, plant or chair back"
  - "no mullions, bars, cross frames, curtains, blinds, stickers or reflections on the window, and nothing in front of it"
  - "no other saturated colour: no red, pink, blue, green or neon light; the facades stay cream and ochre"
  - "the phone is never cut by a frame edge"
  - "no crinkled or foil-like tabletop: real wood grain running in one direction (STYLE@v1 review, V22)"
  - "no borders, side bands, pillarbox strips, seams or vignette frames (STYLE@v1 review, V23)"
hero: true
notes: "All words are HTML (BUILD-SPEC 0): the copy over the headline-safe area and the lock-screen notification 'New message' / 'Mesazh i ri' on the HTML screen mapped to the four screen corners; here the phone is in portrait to the camera, so the notification reads upright. line_text is the live owner H1, kept verbatim (pending owner decision; it does not change this picture). Planes, each its own asset with its own review: plate = this image as generated (it has no cup, so no cup-removal edit pass and no table rebuild are needed; the phone stays); window glass keyed to alpha by a four-point polygon; far = WEB-EXT behind the opening; near = WEB-CUP (a separately generated cup on a seamless dark ground, background-removed and defocused in post), placed over the cup spot with its lower body cut by the bottom edge so no contact point shows. Generation: gpt_image_2_5, aspect_ratio 9:16, resolution 2k, quality medium, variant flare; one reference: image 1 STYLE-TOP@v1 (look only; its baked text must not be copied). No set sheet for the café and no PR-PHONE prop sheet exist (STYLE@v1 failed G-VIS-SHEET and is not attached)."
