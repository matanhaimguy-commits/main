format: static
script_lines: [A1-H1]
line_text: "Grow your business. Without guessing what to do next. / Rritni biznesin tuaj. Pa hamendësime për hapat e ardhshëm."
story_purpose: "Phone master (9:16 portrait) of the act 1 hero of straightscale.com (BRIEF beat 1, Recognition; most visitors arrive on a phone from an ad): the same world as WEB-HERO-D, art-directed so the whole frame is the hero's ground on phones. The calm dark wall at the upper left carries the HTML copy; the red-case phone below lies flat with its bottom end toward the camera (portrait to the camera) so its black screen is large enough for the HTML lock-screen notification mapped with matrix3d to its four screen corners; the window glass is keyed to alpha by polygon so WEB-EXT shows through it. This master contains NO cup: the near parallax plane is the separately generated cup WEB-CUP, composited later over the plain bare table at the bottom-right (the cup spot), so the table there must stay empty wood (BUILD-SPEC act 1, mobile art direction)."
must_read_in_1s: "A red phone lies quiet on a café table in Tirana at night"
