action_physics:
  - "the phone's back lies flat on the tabletop: the case's back rim touches the wood along all four edges, no edge raised, a thin soft contact shadow hugging its outline"
  - "the phone is the only object touching the table: bare wood surrounds it on every side (at least 4% of the frame width between its lower right corner and the bare corner, which begins at x 0.74); nothing touches or overlaps the phone"
  - "the tabletop runs unbroken from its far edge at y 0.58 down to the bottom frame edge across the full width: the near foreground and the bottom-right corner of the frame (the bare corner, x 0.74 to 1.00, y 0.80 to 1.00) are bare wood with the grain and the warm key light continuing evenly into the corner, no object, no cast shadow from anything off frame"
static: true
setting:
  ref: "STYLE-TOP@v1"
  details: "The same café as WEB-HERO-D, inside, central Tirana at night. UPPER 55% (y 0.00 to 0.56): a plain matte near-black wall on the left and across the top, completely empty and calm (EMPTY WALL: x 0.00 to 0.53, y 0.00 to 0.56, and the full-width strip of wall above the window, y 0.00 to 0.07); the wall continues, equally plain, below the window down to the table. WINDOW: one plate-glass window at the upper right (x 0.55 to 0.95, y 0.08 to 0.42), a single rectangular opening in a thin dark frame with four straight inner edges, no mullions or bars crossing it, clear glass with no reflections, nothing in front of it. Through it the Tirana clock tower, a slender square stone tower floodlit warm amber with a small pointed roof, about a third of the opening's width, its roof tip at about y 0.14 and its lower part running down behind the lit buildings to the window's bottom edge (about x 0.68 to 0.80, y 0.14 to 0.42), its clock faces softly glowing discs showing only their two clock hands; around its foot and to both sides of its lower part, warm street lamps and lit cream and ochre facades as soft bokeh, empty of people and cars. TABLE: a dark walnut table fills the lower 40%: its far edge is a straight level line at about y 0.58, its top runs to the bottom edge, bare wood all the way down; real wood grain running left to right, satin finish with soft warm highlights. BARE CORNER: the tabletop in the bottom-right corner of the frame (x 0.74 to 1.00, y 0.80 to 1.00), part of the one unbroken tabletop with no table corner or table edge in it, is plain, bare, evenly lit wood running to the bottom and right frame edges, nothing on it, its grain unbroken, no ring, stain, mark or wet spot. LIGHT: warm tungsten from out of frame above right falls on the table and the phone and reaches the bare tabletop in the bottom-right corner of the frame; the window adds warm glow; the wall stays near-black."
  background_rule: "Nothing on the wall: no lamps, sconces, art, frames, shelves, mirrors, posters, plants or chair backs. Nothing in front of the window opening (no phone, plant, lamp, object or table edge overlaps it), so its glass can be keyed by a four-point polygon. The opening is filled with the night square and the lit tower, never blank or black. No signs, shop names, lettering or readable numerals anywhere (the clock faces show only their two clock hands). No people, figures or silhouettes in the room, in the window view or reflected in the glass or the phone. No cup, saucer, drinking glass or any object other than the phone, anywhere on the table or in the near foreground; no other tables or chairs."
camera:
  framing: "tall portrait still of a window table: the empty dark wall upper left, the lit window upper right (x 0.55 to 0.95, y 0.08 to 0.42), the table across the lower 40% running to the bottom edge as bare wood, with the phone large, lying flat with its bottom end toward the camera (portrait to the camera), and the only object on it; the near foreground and the bottom-right corner are plain table"
  angle: "at seated eye height, looking down at the phone at about 30 degrees below horizontal (the angle the phone box x 0.15 to 0.70, y 0.62 to 0.86 implies) so its screen reads large; the window frame and the tower stay vertical"
  lens: "35mm film look (film stock, not a focal length): the whole phone in sharp focus from its near end to its far end, all four screen corners crisp; behind it the wall and the window view fall off into soft bokeh; the nearest strip of table at the bottom edge slightly soft"
  aspect: "9:16"
  safe_zones: "Empty wall x 0.00 to 0.53, y 0.00 to 0.56, plus the strip y 0.00 to 0.07 across the full width: plain dark wall, nothing in it. The phone and its whole screen fully inside the frame, at least 5% from the left edge and above y 0.88. Bare corner x 0.74 to 1.00, y 0.80 to 1.00: bare table only. No logo anywhere."
