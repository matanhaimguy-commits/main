style: "photorealistic cinematic 35mm film still, shallow depth of field behind the phone (the whole phone sharp), fine film grain; Tirana after dark (style-bible.md): warm tungsten light, deep shadows, near-black scene tone around #1F1F1F; deep red #BE0F18 (the phone case) the only saturated colour besides the warm light; same light and grade as STYLE-TOP@v1 (owner-approved look, G-HUMAN-LOOK)"
must_not:
  - "no people, faces, figures, silhouettes or body parts anywhere, including the window view and any reflection in the phone glass or the window"
  - "no human hands or fingers"
  - "no text, letters, numbers or signage on the wall, the window glass, the tower, the facades, the table or the phone"
  - "no readable numerals on the clock faces"
  - "nothing copied from image 1 (STYLE-TOP@v1) except its light, grade and film grain and the look of the floodlit clock tower seen through its window: none of its lettering (the small spaced capitals, the large white words, the crimson box behind one word, the smaller white line under them) and no gold '1/7' counter, on the wall or anywhere else"
  - "no logos or brand marks: none on the phone or case, and no StraightScale mark drawn in any corner (FL-13)"
  - "no screen content on the phone: no lock screen, clock, wallpaper, icons, UI or glow; nothing displayed on the black screen"
  - "no cup of any kind (espresso cup, coffee cup, mug), no saucer, drinking glass, spoon, dinner plate, laptop, notebook, menu or any object other than the phone on the table, in the near foreground or at the bottom edge; no second phone"
  - "nothing in the bare bottom-right corner (x 0.74 to 1.00, y 0.80 to 1.00): bare wood only, no object, no ring, stain, mark or wet spot, no blurred foreground shape, no cast shadow from anything off frame"
  - "nothing on the wall in the empty wall area (x 0.00 to 0.53, y 0.00 to 0.56): no lamp, sconce, art, frame, shelf, mirror, poster, plant or chair back"
  - "no mullions, bars, cross frames, curtains, blinds, stickers or reflections on the window, and nothing in front of it"
  - "no saturated colour other than the phone's deep red #BE0F18 case: no red, pink, blue, green or neon lights or signs, no crimson boxes; the facades stay cream and ochre"
  - "the phone is never cut by a frame edge"
  - "no crinkled or foil-like tabletop: real wood grain running in one direction (STYLE@v1 review, V22)"
  - "no borders, side bands, pillarbox strips, seams or vignette frames (STYLE@v1 review, V23)"
hero: true
notes: "All words are HTML (BUILD-SPEC 0): the copy over the headline-safe area and the lock-screen notification 'New message' / 'Mesazh i ri' on the HTML screen mapped to the four screen corners; here the phone is in portrait to the camera, so the notification reads upright. line_text is the live owner H1, kept verbatim (pending owner decision; it does not change this picture). Planes, each its own asset with its own review: plate = this image as generated (it has no cup, so no cup-removal edit pass and no table rebuild are needed; the phone stays); window glass keyed to alpha by a four-point polygon; far = WEB-EXT behind the opening; near = WEB-CUP (a separately generated cup on a seamless dark ground, background-removed and defocused in post), placed over the cup spot with its lower body cut by the bottom edge so no contact point shows. Generation: gpt_image_2_5, aspect_ratio 9:16, resolution 2k, quality medium, variant flare; one reference: image 1 STYLE-TOP@v1 (look only; its baked text must not be copied). No set sheet for the café and no PR-PHONE prop sheet exist (STYLE@v1 failed G-VIS-SHEET and is not attached). The image prompt never uses the words cup spot, WEB-CUP, composited, headline, H1, subline, CTA, eyebrow, HTML, notification, proof ribbon, nav bar or logo corner: the empty wall is described only as a plain, empty, near-black wall. Safe-zone reasons (build only, never in the prompt): the HTML H1, subline and CTA unit sit over the empty wall (BUILD-SPEC act 1 has no hero eyebrow); the bottom 12% is kept as a margin for the sticky CTA; the site's nav bar carries the real logo."
