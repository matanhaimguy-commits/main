notes: "No words in this layer; all copy is HTML. line_text is the live owner H1, kept verbatim, because this layer is part of the hero it sits in. Generation: gpt_image_2_5, aspect_ratio 3:4, resolution 2k, quality medium, variant flare; one reference: image 1 STYLE-TOP@v1 (Higgsfield job e6bc8781-70fa-4450-aa10-989160b20a2e), for light and grade only (it shows no cup; its wall, window, tower and baked text must not be copied). The prompt's STYLE block is byte-identical to the masters'; its 'shallow depth of field' has nothing to act on here because the ground is plain, and the prompt asks for the whole cup sharp because the defocus is added in post. Post, each step reviewed with the layer (not part of this generation): background removal to an alpha cutout (the near-black ground against the white porcelain gives a clean key; the hidden handle leaves no hole to key), a lens blur matched to the masters' near plane, then scale and placement over each master's cup spot with the lower body below the bottom edge (BUILD-SPEC act 1 near: cup at most 50 KB with alpha). Geometry: a 3:4 frame with the cup at about 68% of the frame height makes it about 78% of the width (a demitasse seen from about 20 degrees above is a little taller than wide), which leaves 10 to 11% clear on each side and 14 to 16% above and below. No PR-CUP prop sheet exists; the cup is not story-critical, so this spec's content line is its design."
