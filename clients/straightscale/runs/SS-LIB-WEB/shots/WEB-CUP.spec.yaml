notes: "No words in this layer; all copy is HTML. line_text is the live owner H1, kept verbatim, because this layer is part of the hero it sits in. Generation: gpt_image_2_5, aspect_ratio 3:4, resolution 2k, quality medium, variant flare; one reference: image 1 STYLE-TOP@v1 (Higgsfield job e6bc8781-70fa-4450-aa10-989160b20a2e), for light and grade only (it shows no cup; its wall, window, tower and baked text must not be copied). The prompt's STYLE block is this spec's style line, word for word, not the masters' block. It keeps their light, grade and grain words. It leaves out 'shallow depth of field', because a cup filling 78% of the frame width has depth for it to act on (near rim, far rim, crema, handle, foot). It also leaves out the masters' phone-case colour line and their #1F1F1F scene tone, because this layer has no phone and its background is #1A1716. The prompt asks for the whole cup sharp because the defocus is added in post. ANGLE (one layer for both masters): WEB-HERO-D now looks down at its phone at about 40 degrees (its camera line was revised after this spec's first review, from 'tilted slightly down'); its cup spot is nearer and lower but far to the right, so a cup there is seen from about 40 to 42 degrees (rim ellipse about 0.64 to 0.67 as tall as wide). WEB-HERO-M looks down at its phone at about 30 degrees; its cup spot is lower and nearer, so a cup there is seen from about 37 to 39 degrees (about 0.60 to 0.63). One layer drawn from about 40 degrees (0.64) sits within about 3 degrees of both, which the defocus and the bottom-edge cut absorb, so no second cup layer is needed. Check: each composite is reviewed at its display size (desktop, and phone size for WEB-HERO-M) for a rim that reads too flat or too round against the table. HANDLE: at about 40 degrees a handle turned straight away rises above the far rim (it stays hidden only when it sits lower than about 0.84 times its reach behind the cup), so it is on the cup's right side, seen side-on; in each composite the handle side faces the master's right edge, which may cut it. ESPRESSO: at about 40 degrees, with the surface about 1 cm below the rim, the near wall hides only the nearest 1.2 cm or so of the 4.6 cm coffee surface. The image prompt never uses the words café, café table, masters, bottom-right, cup spot, composite or WEB-HERO; table appears only in the negatives. The angle and key match the masters' seated eye height and light at their cup spots. Post, each step reviewed with the layer (not part of this generation): background removal to an alpha cutout by an object segmentation matte, not a luma or colour key (the brown-black espresso is close in tone to the #1A1716 background): check the alpha keeps the coffee (no hole inside the rim) and clears the background inside the handle loop; a lens blur matched to the masters' near plane; then scale and placement over each master's cup spot with the lower body below the bottom edge (BUILD-SPEC act 1 near: cup at most 50 KB with alpha). The cutout carries no contact shadow, so a visible foot would float: place it so the foot stays below the master's bottom edge at every parallax state (pointer up to 18 px up, scale 1.06, the extra drift down-right). Geometry: the cup is 6 cm wide and tall, the handle reaching about 1.8 cm beyond the rim; seen from about 40 degrees its outline is about 7.8 cm wide (body plus handle) by 7.6 cm tall (body height x cos 40 plus half the rim and foot ellipses x sin 40), so in a 3:4 frame spanning x 0.11 to 0.89 it is about 58% of the frame height, leaving 10 to 11% clear on each side and 20 to 21% above and below. No PR-CUP prop sheet exists; the cup is not story-critical, so this spec's content line is its design."
