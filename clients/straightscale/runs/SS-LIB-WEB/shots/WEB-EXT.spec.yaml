  details: "Central Tirana at night, seen from street level across the square. CENTRE: one clock tower, the only tower in the frame: a slender square stone shaft seen corner-on as in image 1 (two adjacent faces visible, the corner edge vertical), floodlit warm amber; one round clock face on each visible face, both at the same height near the top; above the clocks one storey of small arched openings, then a small pointed four-sided roof; the clock faces are softly glowing discs, each showing only two dark clock hands and no numerals. SKY: the upper part of the frame is a calm, near-black night sky with the faint cool blue-grey cast of image 1's sky (about #0A0E14 at the top edge; a dark sky tone, not a blue light), no stars, no moon, no clouds lit by colour, a soft natural gradient: darkest at the top edge, lifting a little toward the rooftops and around the floodlit tower with a faint warm haze of city glow, as in image 1; it is the only plain area in the frame and never a uniform flat fill. LOWER THIRD: the square, with warm street lamps and lit cream and ochre facades of low buildings and a few dark trees, all as soft round bokeh discs and soft glowing shapes, wet-looking paving catching warm reflections. SIDES: the night scene continues to both edges with dimmer facades and scattered warm lights, so no part of the frame below the sky is empty, blank or flat; at least 20% of continuous scene on every side of the tower. The square is empty: no people, no cars."
