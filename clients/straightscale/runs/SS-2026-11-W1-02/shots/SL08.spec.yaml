    Camera about 10 degrees above the sales desk: the sales desk top spans from 70% of the frame height (its far
    edge, measured from the top of the frame) down to the bottom; the wall behind it fills the upper 70%. Wide,
    calm, every lamp on, the shop empty. A small window at the right edge of the frame at 42% to 62% of the height,
    below the text wall, slightly out of focus, the Tirana clock tower a small lit silhouette in it.'
