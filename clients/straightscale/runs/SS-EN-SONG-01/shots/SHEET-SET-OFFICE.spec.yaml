style: 'Handmade claymation stop-motion look: plasticine characters with visible thumbprints and slight tool marks, soft rounded
  forms, miniature handmade set pieces, warm practical lighting, shallow depth of field like a tabletop set, gentle stop-motion
  texture. Stop-motion puppet lane: tiny real craft materials on the clay (thread-wrapped hair, real fabric and felt, real
  stitching). Palette: warm ivory and marble, charcoal; the four fix scraps are the only loud colours; the method cloth is
  one calm sand-cream linen.'
must_not:
- no logos, no real platform names or icons
- no lettering anywhere except the listed strings
- no photoreal skin, no glossy CGI plastic
- no extra, missing or merged fingers
- no speech bubbles unless listed
- no duplicate copies of a character within one view
- no people, no Maya, no scraps, no cloth
- no clients in the APRIL pockets
- nothing on the rod
