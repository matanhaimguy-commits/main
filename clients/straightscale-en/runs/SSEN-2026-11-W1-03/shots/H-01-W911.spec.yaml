notes: 'Concept frame for Hook Lab v7 (slot W1-03, bank idea W9-11 replacing "Built or patched?", which is out of rounds).
  The text hook is laid on top in the edit, not drawn by the model. "WE DELIVER RESULTS" is an example of an offer line in
  the seller''s words, written by us, not a buyer quote. The card speaks later in the reel (reel_talking_object); frame 1
  shows it without a face. Gate decision for hook frames (main session, delegated by Matan, plan 28 Oct): a G-VIS defect
  that is only position or offset of up to 10% of the frame, with content, text and layout otherwise right, is fixed in
  the edit (reframe on the canvas, extend the plain background) and does not fail the frame.'
