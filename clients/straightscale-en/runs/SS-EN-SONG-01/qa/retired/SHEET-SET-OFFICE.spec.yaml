style: 'Handmade claymation stop-motion look: plasticine forms with visible thumbprints and slight tool marks, soft rounded
  forms, miniature handmade set pieces, gentle stop-motion texture; on this sheet soft warm light and the whole set in focus,
  no depth-of-field blur. Stop-motion puppet lane: tiny real craft materials on the clay (real fabric and felt, real stitching).
  Palette: warm ivory, charcoal, silver and white clay, pale wood; plain matte surfaces, no marble texture. No fabric scraps
  on this sheet.'
must_not:
- no logos, no real platform names or icons
- no lettering anywhere
- no photoreal skin, no glossy CGI plastic
- no people of any size, no hands
- no posters, frames, books, signs or shopfronts
- no organizer, no fabric scraps, no cloth on the set
- the laptop screen never faces the camera
- nothing in the bin
- nothing on the rod except its five clay rings
hero: true
notes: 'Look bible step 7. Simplified set (main session, 28 Oct, after 3 prompt rounds on the earlier 3-panel spec): the series
