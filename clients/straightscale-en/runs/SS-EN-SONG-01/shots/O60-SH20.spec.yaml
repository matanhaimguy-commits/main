style: 'Handmade claymation stop-motion look: plasticine characters with visible thumbprints and slight tool marks, soft rounded
  forms, miniature handmade set pieces, warm practical lighting, shallow depth of field like a tabletop set, gentle stop-motion
  texture. 12 fps stepped stop-motion cadence, no motion blur; one motion action in the shot. World: a clay home office in
  warm ivory and marble tones with a charcoal desk; the four fix scraps are the only loud saturated colours in the world;
  the method cloth is one calm sand-cream colour.'
