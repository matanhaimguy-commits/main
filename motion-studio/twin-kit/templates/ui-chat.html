<!doctype html>
<!--
  Twin kit UI scene: a chat (B-roll and UI layer, z 20). Neutral messaging look (no app's brand). Messages arrive in
  order; "them" messages are preceded by a typing indicator. Copy comes from the EDL and must be true or an example.
  Variables: messages (JSON [{"from":"them"|"me","text"}]), name (thread title), y (top of the thread, px), dur.
  Sound: ping on the first message.
-->
<html
  data-composition-id="kit-chat"
  data-composition-duration="3"
  data-composition-variables='[
    {"id":"messages","type":"string","label":"Messages (JSON)","default":"[{\"from\":\"me\",\"text\":\"Hi! Still interested?\"},{\"from\":\"them\",\"text\":\"Example reply\"}]"},
    {"id":"name","type":"string","label":"Thread title","default":"Example lead"},
    {"id":"y","type":"number","label":"Thread top (px)","default":440},
    {"id":"dur","type":"number","label":"On screen (s)","default":2.5}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #1F1F1F; }
        .ch-head { position: absolute; left: 0; right: 0; top: 290px; padding: 0 80px; display: flex; align-items: center; gap: 26px;
                   font-family: var(--kit-ui); font-weight: 700; font-size: 50px; color: #F8F6EF; }
        .ch-ava { width: 96px; height: 96px; border-radius: 50%; background: #3A3936; border: 3px solid #EDE4D6; }
        .ch-thread { position: absolute; left: 70px; right: 70px; display: flex; flex-direction: column; gap: 22px; }
        .ch-msg { max-width: 760px; padding: 26px 34px; border-radius: 40px; font-family: var(--kit-ui); font-weight: 500;
                  font-size: 46px; line-height: 1.22; }
        .ch-me { align-self: flex-end; background: #F8F6EF; color: #1F1F1F; border-bottom-right-radius: 12px; }
        .ch-them { align-self: flex-start; background: #3A3936; color: #F8F6EF; border-bottom-left-radius: 12px; }
        .ch-typing { align-self: flex-start; display: flex; gap: 12px; padding: 30px 34px; border-radius: 40px; background: #3A3936; }
        .ch-typing i { width: 18px; height: 18px; border-radius: 50%; background: #F8F6EF; opacity: 0.4; display: block; }
      </style>
      <div id="root" data-composition-id="kit-chat" data-duration="3">
        <div class="ch-head"><span class="ch-ava"></span><span class="ch-name"></span></div>
        <div class="ch-thread"></div>
      </div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
          var thread = root.querySelector(".ch-thread");
          root.querySelector(".ch-name").textContent = v.name || "";
          thread.style.top = (Number(v.y) || 440) + "px";
          var msgs = [];
          try { msgs = JSON.parse(v.messages || "[]"); } catch (e) { msgs = []; }
          var dur = Number(v.dur) || 2.5, step = Math.min(0.7, Math.max(0.35, (dur - 0.5) / Math.max(1, msgs.length)));
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(root.querySelector(".ch-head"), { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0);
          msgs.forEach(function (m, k) {
            var at = 0.25 + k * step;
            if (m.from === "them") {
              var typing = document.createElement("div"); typing.className = "ch-typing";
              typing.innerHTML = "<i></i><i></i><i></i>"; thread.appendChild(typing);
              var t0 = Math.max(0.05, at - Math.min(0.3, step * 0.6));
              tl.fromTo(typing, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.12 }, t0);
              tl.fromTo(typing.querySelectorAll("i"), { y: 0 }, { y: -10, duration: 0.12, yoyo: true, repeat: 1, stagger: 0.06, ease: "sine.inOut" }, t0 + 0.05);
              tl.set(typing, { display: "none" }, at);
            }
            var b = document.createElement("div"); b.className = "ch-msg " + (m.from === "me" ? "ch-me" : "ch-them");
            b.textContent = m.text || ""; thread.appendChild(b);
            tl.fromTo(b, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.6)",
                           transformOrigin: m.from === "me" ? "100% 100%" : "0% 100%" }, at);
          });
          window.__timelines["kit-chat"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
