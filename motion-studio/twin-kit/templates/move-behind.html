<!doctype html>
<!--
  Twin kit move 2: one big word behind the subject (layer 30, under the twin). The twin's cut-out matte is the mask:
  the word sits between the set and the twin, so the head and shoulders cover part of it. The word is on screen from
  its first frame (the hook) and slams in with a scale settle, pushes in slowly while it holds, and leaves on a quick drop.
  Variables: text, y (centre, px), size (font px, shrunk to fit the width), color, dur (s on screen).
  Sound: impact-bass-1 on the landing (kit/moves.py).
-->
<html
  data-composition-id="kit-behind"
  data-composition-duration="3"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Word","default":"2 YEARS"},
    {"id":"y","type":"number","label":"Centre y (px)","default":620},
    {"id":"size","type":"number","label":"Font size (px)","default":360},
    {"id":"max_w","type":"number","label":"Max width (px, inside the side margins)","default":890},
    {"id":"color","type":"color","label":"Colour","default":"#F8F6EF"},
    {"id":"dur","type":"number","label":"On screen (s)","default":2}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .bw-line { position: absolute; left: 0; right: 0; display: flex; justify-content: center; will-change: transform, opacity; }
        .bw-word { display: inline-block; font-family: var(--kit-display); font-weight: 900; line-height: 0.86;
                   letter-spacing: -0.02em; white-space: nowrap; text-transform: uppercase; }
      </style>
      <div id="root" data-composition-id="kit-behind" data-duration="3">
        <div class="bw-line"><span class="bw-word" data-layout-allow-occlusion></span></div>
      </div>
      <script>
        // built after the web fonts load: widths measured with a fallback font would be wrong (kit review 30 Oct)
        document.fonts.ready.then(function () {
          var root = document.getElementById("root");
          var v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
          var line = root.querySelector(".bw-line"), word = root.querySelector(".bw-word");
          var dur = Number(v.dur) || 2, size = Number(v.size) || 360;
          word.textContent = v.text || "";
          word.style.color = v.color || "#F8F6EF";
          // kit:fit start (pure; tests/test_template_logic.py runs this exact text under node)
          // The font size that keeps the word inside the side margins at the move's biggest scale (the slam), with 2%
          // for glyph overhang past the measured box.
          function fitPx(size, width, maxW, maxScale, margin) {
            var limit = Math.min(maxW, (1080 - 2 * margin) / maxScale * 0.98);
            return width > limit ? Math.floor(size * limit / width) : size;
          }
          // kit:fit end
          var MAX_SCALE = 1.06;
          word.style.fontSize = size + "px";
          var px = fitPx(size, word.getBoundingClientRect().width, Number(v.max_w) || 890, MAX_SCALE, 65);
          word.style.fontSize = px + "px";
          line.style.top = (Number(v.y) || 620) - px * 0.43 + "px";
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(word, { scale: MAX_SCALE, opacity: 1, y: -16 }, { scale: 1, opacity: 1, y: 0, duration: 0.26, ease: "expo.out" }, 0);
          tl.fromTo(word, { scale: 1 }, { scale: 1.05, duration: Math.max(0.1, dur - 0.5), ease: "none", immediateRender: false }, 0.26);
          // the exit moves the line, never the word (one owner per transform; see move-twotone.html)
          tl.fromTo(line, { y: 0, opacity: 1 }, { y: 80, opacity: 0, duration: 0.16, ease: "power2.in", immediateRender: false }, Math.max(0.3, dur - 0.18));
          window.__timelines["kit-behind"] = tl;
        });
      </script>
    </template>
  </body>
</html>
