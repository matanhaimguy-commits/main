<!doctype html>
<!--
  Twin kit: the logo end card (layer 65). The brand's real logo file (never redrawn), a hairline that draws out from
  it, and one line under it (the keyword CTA). The logo lands on a scale settle; the line rises word by word.
  Variables: logo (image path), line, sub (small line, optional), logo_w (px), dur. Sound: impact-bass-2.
-->
<html
  data-composition-id="kit-endcard"
  data-composition-duration="3"
  data-composition-variables='[
    {"id":"logo","type":"string","label":"Logo file","default":""},
    {"id":"line","type":"string","label":"Line","default":"Comment PLAN"},
    {"id":"sub","type":"string","label":"Small line","default":""},
    {"id":"logo_w","type":"number","label":"Logo width (px)","default":640},
    {"id":"dur","type":"number","label":"On screen (s)","default":2}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--kit-bg); }
        .ec-col { position: absolute; left: 90px; right: 90px; top: 560px; display: flex; flex-direction: column; align-items: center; }
        .ec-logo { display: block; height: auto; }
        .ec-rule { width: 420px; height: 3px; margin: 64px 0 56px; background: var(--kit-accent); transform-origin: 50% 50%; }
        .ec-line { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.28em; font-family: var(--kit-display);
                   font-weight: 900; font-size: 96px; line-height: 1.05; color: var(--kit-fg); text-align: center; }
        .ec-w { display: inline-block; }
        .ec-w.ec-key { color: var(--kit-accent); font-style: italic; }
        .ec-sub { margin-top: 36px; font-family: var(--kit-ui); font-weight: 500; font-size: 46px; color: var(--kit-fg); opacity: 0.8; }
      </style>
      <div id="root" data-composition-id="kit-endcard" data-duration="3">
        <div class="ec-col">
          <img class="ec-logo" alt="" />
          <div class="ec-rule"></div>
          <div class="ec-line"></div>
          <div class="ec-sub"></div>
        </div>
      </div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
          var logo = root.querySelector(".ec-logo"), rule = root.querySelector(".ec-rule");
          var line = root.querySelector(".ec-line"), sub = root.querySelector(".ec-sub");
          if (v.logo) logo.src = v.logo;
          logo.style.width = (Number(v.logo_w) || 640) + "px";
          // the word in capitals is the keyword: it takes the accent
          var words = String(v.line || "").split(/\s+/).filter(Boolean).map(function (t) {
            var w = document.createElement("span");
            w.className = "ec-w" + (t.length > 1 && t === t.toUpperCase() && /[A-Z]/.test(t) ? " ec-key" : "");
            w.textContent = t; line.appendChild(w); return w;
          });
          sub.textContent = v.sub || "";
          var dur = Number(v.dur) || 2;
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(logo, { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 0);
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 0.18);
          tl.fromTo(words, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)", stagger: 0.08 }, 0.32);
          tl.fromTo(sub, { opacity: 0 }, { opacity: sub.textContent ? 0.8 : 0, duration: 0.3 }, 0.6);
          tl.fromTo(logo, { y: 0 }, { y: -10, duration: Math.max(0.2, dur - 0.5), ease: "sine.inOut", immediateRender: false }, 0.45);
          window.__timelines["kit-endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
