<!doctype html>
<!--
  Twin kit UI scene: notifications (B-roll and UI layer, z 20). A lock-screen style stack in a neutral system look
  (no app's brand): each card drops in from above, pushing the ones before it down. Copy is passed in by the EDL and
  must be true or labelled as an example (house rules: no invented numbers or clients).
  Variables: items (JSON [{"app","title","body"}]), time (clock text, optional), y (top of the stack, px), dur.
  Sound: notification on the first card.
-->
<html
  data-composition-id="kit-notification"
  data-composition-duration="3"
  data-composition-variables='[
    {"id":"items","type":"string","label":"Cards (JSON list of {app,title,body})","default":"[{\"app\":\"Ads\",\"title\":\"Your ad is live\",\"body\":\"Example card\"}]"},
    {"id":"time","type":"string","label":"Clock (optional)","default":""},
    {"id":"y","type":"number","label":"Stack top (px)","default":380},
    {"id":"dur","type":"number","label":"On screen (s)","default":2}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden;
                background: linear-gradient(180deg, #2a2724 0%, #151413 100%); }
        .nt-clock { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: var(--kit-ui);
                    font-weight: 300; font-size: 190px; color: var(--kit-fg); letter-spacing: -0.02em; }
        .nt-stack { position: absolute; left: 70px; right: 70px; }
        .nt-card { position: absolute; left: 0; right: 0; padding: 30px 36px; border-radius: 40px;
                   background: rgba(248, 246, 239, 0.94); color: #1F1F1F; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
                   font-family: var(--kit-ui); }
        .nt-app { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 500; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
        .nt-dot { width: 44px; height: 44px; border-radius: 11px; background: #1F1F1F; }
        .nt-title { margin-top: 14px; font-size: 50px; font-weight: 700; line-height: 1.12; }
        .nt-body { margin-top: 6px; font-size: 44px; font-weight: 500; line-height: 1.2; opacity: 0.75; }
      </style>
      <div id="root" data-composition-id="kit-notification" data-duration="3">
        <div class="nt-clock"></div>
        <div class="nt-stack"></div>
      </div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
          var stack = root.querySelector(".nt-stack");
          root.querySelector(".nt-clock").textContent = v.time || "";
          stack.style.top = (Number(v.y) || 380) + "px";
          var items = [];
          try { items = JSON.parse(v.items || "[]"); } catch (e) { items = []; }
          var gap = 24, heights = [];
          var cards = items.map(function (it) {
            var c = document.createElement("div"); c.className = "nt-card";
            c.innerHTML = '<div class="nt-app"><span class="nt-dot"></span><span></span></div><div class="nt-title"></div><div class="nt-body"></div>';
            c.querySelector(".nt-app span:last-child").textContent = it.app || "";
            c.querySelector(".nt-title").textContent = it.title || "";
            c.querySelector(".nt-body").textContent = it.body || "";
            if (!it.body) c.querySelector(".nt-body").style.display = "none";
            stack.appendChild(c); heights.push(c.getBoundingClientRect().height || 200); return c;
          });
          var dur = Number(v.dur) || 2, step = Math.min(0.42, Math.max(0.22, (dur - 0.6) / Math.max(1, cards.length)));
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(root.querySelector(".nt-clock"), { opacity: 0 }, { opacity: 0.9, duration: 0.2 }, 0);
          // newest card on top: card k arrives at k*step and pushes every older card down by its height
          cards.forEach(function (c, k) {
            var at = 0.12 + k * step;
            tl.fromTo(c, { y: -260, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.4)" }, at);
            for (var j = 0; j < k; j++) {
              var below = 0;
              for (var m = j + 1; m <= k; m++) below += heights[m] + gap;
              tl.to(cards[j], { y: below, duration: 0.3, ease: "expo.out" }, at);
            }
          });
          window.__timelines["kit-notification"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
