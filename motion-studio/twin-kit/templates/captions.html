<!doctype html>
<!--
  Twin kit: word captions (layer 60) from the voice's word timings on the film clock. Captions 80 to 100 px in the
  caption band (55-62% down, STANDARDS 6), up to max_words words and max_chars characters per group, split at
  pauses and sentence ends, gone 0.35 s after the last word; the spoken word turns the accent colour. Each group pops on a short
  settle. Hidden over the given ranges (the end card, full-screen UI that carries its own words).
  Variables: words (JSON [{w,s,e}], film seconds), hide (JSON [[start,end],...]), y (centre, px), size, max_words, dur.
-->
<html
  data-composition-id="kit-captions"
  data-composition-duration="60"
  data-composition-variables='[
    {"id":"words","type":"string","label":"Words JSON","default":"[]"},
    {"id":"hide","type":"string","label":"Hidden ranges JSON","default":"[]"},
    {"id":"y","type":"number","label":"Centre y (px)","default":1130},
    {"id":"size","type":"number","label":"Font size (px)","default":88},
    {"id":"max_words","type":"number","label":"Words per group","default":3},
    {"id":"max_chars","type":"number","label":"Characters per group","default":14},
    {"id":"left","type":"number","label":"Left margin (px)","default":65},
    {"id":"right","type":"number","label":"Right margin (px, the right 21% of the lower half stays clear)","default":227},
    {"id":"dur","type":"number","label":"Film length (s)","default":10}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .cp-group { position: absolute; display: flex; justify-content: center; flex-wrap: wrap;
                    gap: 0 0.28em; opacity: 0; }
        .cp-w { display: inline-block; font-family: var(--kit-ui); font-weight: 700; color: var(--kit-fg); text-transform: uppercase;
                letter-spacing: 0.01em; paint-order: stroke fill; -webkit-text-stroke: 10px rgba(0, 0, 0, 0.85); }
      </style>
      <div id="root" data-composition-id="kit-captions" data-duration="60"></div>
      <script>
        (function () {
          var root = document.getElementById("root");
          var v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
          var words = [], hide = [];
          try { words = JSON.parse(v.words || "[]"); hide = JSON.parse(v.hide || "[]"); } catch (e) {}
          var size = Number(v.size) || 88, y = Number(v.y) || 1130, maxW = Number(v.max_words) || 3, maxC = Number(v.max_chars) || 14;
          var left = Number(v.left == null ? 65 : v.left), right = Number(v.right == null ? 227 : v.right);
          var groups = [], cur = [];
          words.forEach(function (w, i) {
            var prev = cur[cur.length - 1];
            var chars = cur.map(function (c) { return c.w; }).join(" ").length + 1 + w.w.length;
            if (cur.length && (cur.length >= maxW || chars > maxC || w.s - prev.e > 0.25 || /[.!?,]$/.test(prev.w))) { groups.push(cur); cur = []; }
            cur.push(w);
          });
          if (cur.length) groups.push(cur);
          function hidden(t) { return hide.some(function (r) { return t >= r[0] - 1e-6 && t < r[1]; }); }
          // a card never runs into a hidden range (the end card), and leaves 0.08 s before it (its flash starts early)
          function nextHide(t) { return hide.reduce(function (m, r) { return r[0] > t ? Math.min(m, r[0] - 0.08) : m; }, Infinity); }
          var tl = gsap.timeline({ paused: true });
          var accent = getComputedStyle(root).getPropertyValue("--kit-accent").trim() || "#DD9A10";
          var fg = getComputedStyle(root).getPropertyValue("--kit-fg").trim() || "#F8F6EF";
          groups.forEach(function (g, k) {
            var el = document.createElement("div"); el.className = "cp-group";
            el.style.top = y - size * 0.6 + "px"; el.style.fontSize = size + "px";
            el.style.left = left + "px"; el.style.right = right + "px";
            el.setAttribute("data-layout-allow-caption-zone", "");
            var spans = g.map(function (w) {
              var s = document.createElement("span"); s.className = "cp-w"; s.style.fontSize = size + "px";
              s.textContent = w.w.replace(/[.,!?;:]+$/, ""); el.appendChild(s); return s;
            });
            root.appendChild(el);
            // a card leaves at the next card or 0.35 s after its last word, so no card holds over a silence
            var last = g[g.length - 1].e + 0.35;
            var start = g[0].s, end = Math.min(k + 1 < groups.length ? Math.min(groups[k + 1][0].s, last) : last, nextHide(start));
            if (hidden(start)) return;
            tl.fromTo(el, { opacity: 1, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)", immediateRender: false }, start);
            tl.set(el, { opacity: 0 }, end);
            g.forEach(function (w, i) {
              tl.set(spans[i], { color: accent }, w.s);
              tl.set(spans[i], { color: fg }, w.e);
            });
          });
          window.__timelines["kit-captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
