<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>MaxDigital: חנות שמנוהלת בשבילכם (v2)</title>
<style>
@font-face { font-family: "Heebo"; font-weight: 400; src: url(assets/fonts/heebo-hebrew-400-normal.woff2); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
@font-face { font-family: "Heebo"; font-weight: 500; src: url(assets/fonts/heebo-hebrew-500-normal.woff2); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
@font-face { font-family: "Heebo"; font-weight: 700; src: url(assets/fonts/heebo-hebrew-700-normal.woff2); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
@font-face { font-family: "Heebo"; font-weight: 800; src: url(assets/fonts/heebo-hebrew-800-normal.woff2); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
@font-face { font-family: "Heebo"; font-weight: 500; src: url(assets/fonts/heebo-latin-500-normal.woff2); unicode-range: U+0000-00FF, U+2010-2027, U+2605; }
@font-face { font-family: "Heebo"; font-weight: 700; src: url(assets/fonts/heebo-latin-700-normal.woff2); unicode-range: U+0000-00FF, U+2010-2027, U+2605; }
@font-face { font-family: "Heebo"; font-weight: 800; src: url(assets/fonts/heebo-latin-800-normal.woff2); unicode-range: U+0000-00FF, U+2010-2027, U+2605; }
html, body { margin: 0; background: #00172E; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// MaxDigital v2 (owner notes 2026-11-17): real images made on Higgsfield (one example store, VELORA, carried from the
// store to the product page, the Facebook ads and the shipping), split into layers that enter separately; trust popups
// from maxdigital.co.il; camera moves (hook punch, whip pans, punch-ins, shake on stamps); denser effects; an energetic
// voice. The signature device of v1 stays: UI draws as a sky outline, then fills.
// Clock: audio/words.js (v3: Brandify Eagle voice, emotion tags, 1.07x). Every cue is a spoken word index, nothing retyped.
import { spring, clamp } from '../../lib/motion.js';
import WORDS from './audio/words.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080;
const C = {
  navy: '#00172E', deep: '#1D2088', sky: '#00A4F0', ice: '#7DCEF4', white: '#FFFFFF', mist: '#A9BED3',
  dim: '#5B7590', panel: '#0A2A4A', panel2: '#0E3459', grey: '#3B4D60', ink: '#0B1F33',
};
const F = (w, s) => `${w} ${s}px Heebo`;
const TYPE = [190, 26], POP = [320, 19], SOFT = [90, 19], SNAP = [420, 30];
const sp = (t, t0, [k, d] = TYPE) => spring(t - t0, k, d);
const mix = (a, b, p) => a + (b - a) * p;
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const ramp = (t, t0, dur) => smooth((t - t0) / dur);
const S = (i) => WORDS.words[i].s, E = (i) => WORDS.words[i].e;
const VO_END = WORDS.words[WORDS.words.length - 1].e;
const T_END = VO_END + 2.6;

// ---------- primitives ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function dbox(x, y, w, h, r, pDraw, pFill, fill = C.panel, stroke = C.sky, lw = 3) {
  if (pDraw <= 0) return;
  const per = 2 * (w + h);
  if (pFill > 0) { rr(x, y, w, h, r); ctx.save(); ctx.globalAlpha *= clamp(pFill); ctx.fillStyle = fill; ctx.fill(); ctx.restore(); }
  rr(x, y, w, h, r); ctx.save(); ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round';
  if (pDraw < 1) ctx.setLineDash([per * pDraw, per]);
  ctx.globalAlpha *= mix(1, 0.55, clamp(pFill)); ctx.stroke(); ctx.restore();
}
function dline(pts, p, color = C.sky, lw = 4) {
  if (p <= 0) return;
  let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  ctx.save(); ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
  ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p < 1) ctx.setLineDash([len * p, len]); ctx.stroke(); ctx.restore();
}
function T(str, x, y, size, weight = 700, color = C.white, align = 'right', alpha = 1, shadow = false) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.font = F(weight, size); ctx.fillStyle = color;
  if (shadow) { ctx.shadowColor = 'rgba(0,10,25,0.75)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 4; }
  ctx.direction = 'rtl'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y); ctx.restore();
}
const tw = (str, size, weight = 700) => { ctx.save(); ctx.font = F(weight, size); const m = ctx.measureText(str).width; ctx.restore(); return m; };
function rise(str, x, y, size, t, t0, weight = 800, color = C.white, align = 'right', shadow = true) {
  const p = sp(t, t0, TYPE); if (p <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 1.2, W, size * 1.55); ctx.clip();
  T(str, x, y + (1 - p) * size * 1.1, size, weight, color, align, clamp(p * 1.6), shadow); ctx.restore();
}
function pill(str, cx, cy, size, p, fill = C.sky, color = C.navy, padX = 0.9) {
  if (p <= 0) return 0;
  const w = tw(str, size, 800) + size * padX * 2, h = size * 1.75;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(mix(0.6, 1, p), mix(0.6, 1, p)); ctx.globalAlpha *= clamp(p * 1.5);
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = fill; ctx.fill(); T(str, 0, size * 0.36, size, 800, color, 'center'); ctx.restore();
  return w;
}
function check(cx, cy, s, p, color = C.sky, lw = 10) { dline([[cx - s * 0.5, cy], [cx - s * 0.12, cy + s * 0.38], [cx + s * 0.55, cy - s * 0.42]], p, color, lw); }
function icon(kind, cx, cy, s, p, color = C.sky) {
  const L = (pts) => dline(pts.map(([a, b]) => [cx + a * s, cy + b * s]), p, color, Math.max(3, s * 0.07));
  const box = (x, y, w, h, r = 0.08) => dbox(cx + x * s, cy + y * s, w * s, h * s, r * s, p, 0, C.panel, color, Math.max(3, s * 0.07));
  if (kind === 'site') { box(-0.5, -0.38, 1, 0.76); L([[-0.5, -0.18], [0.5, -0.18]]); L([[-0.32, 0.02], [0.05, 0.02]]); L([[-0.32, 0.18], [0.3, 0.18]]); }
  if (kind === 'truck') { box(-0.52, -0.25, 0.62, 0.42); L([[0.1, -0.08], [0.32, -0.08], [0.5, 0.08], [0.5, 0.17], [0.1, 0.17]]);
    ctx.save(); ctx.lineWidth = s * 0.07; ctx.strokeStyle = color; ctx.globalAlpha *= clamp(p * 2);
    for (const x of [-0.3, 0.3]) { ctx.beginPath(); ctx.arc(cx + x * s, cy + 0.27 * s, 0.09 * s, 0, Math.PI * 2 * clamp(p)); ctx.stroke(); } ctx.restore(); }
  if (kind === 'mega') { L([[-0.45, -0.1], [-0.45, 0.12], [-0.2, 0.12], [0.35, 0.38], [0.35, -0.36], [-0.2, -0.1], [-0.45, -0.1]]); L([[-0.3, 0.12], [-0.22, 0.4]]); L([[0.5, -0.12], [0.5, 0.14]]); }
  if (kind === 'angry') { box(-0.48, -0.36, 0.96, 0.62, 0.2); L([[-0.2, 0.26], [-0.3, 0.44], [0.0, 0.26]]); L([[-0.26, -0.18], [-0.08, -0.08]]); L([[0.26, -0.18], [0.08, -0.08]]); L([[-0.16, 0.1], [0.0, 0.03], [0.16, 0.1]]); }
  if (kind === 'box') { L([[-0.45, -0.18], [0, -0.38], [0.45, -0.18], [0.45, 0.28], [0, 0.46], [-0.45, 0.28], [-0.45, -0.18]]); L([[-0.45, -0.18], [0, 0.0], [0.45, -0.18]]); L([[0, 0.0], [0, 0.46]]); }
  if (kind === 'chart') { L([[-0.48, 0.38], [-0.48, -0.42]]); L([[-0.48, 0.38], [0.5, 0.38]]); L([[-0.36, 0.18], [-0.1, 0.0], [0.08, 0.1], [0.42, -0.3]]); }
  if (kind === 'shield') { L([[0, -0.46], [0.4, -0.3], [0.36, 0.1], [0, 0.46], [-0.36, 0.1], [-0.4, -0.3], [0, -0.46]]); L([[-0.16, 0.0], [-0.03, 0.14], [0.2, -0.14]]); }
  if (kind === 'clock') { ctx.save(); ctx.lineWidth = s * 0.07; ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(cx, cy, s * 0.42, 0, Math.PI * 2 * clamp(p)); ctx.stroke(); ctx.restore(); L([[0, -0.24], [0, 0], [0.18, 0.1]]); }
  if (kind === 'user') { ctx.save(); ctx.lineWidth = s * 0.07; ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(cx, cy - s * 0.16, s * 0.18, 0, Math.PI * 2 * clamp(p)); ctx.stroke(); ctx.restore(); L([[-0.34, 0.42], [-0.3, 0.2], [-0.12, 0.08], [0.12, 0.08], [0.3, 0.2], [0.34, 0.42]]); }
  if (kind === 'doc') { box(-0.34, -0.44, 0.68, 0.88, 0.06); L([[-0.18, -0.2], [0.18, -0.2]]); L([[-0.18, 0], [0.18, 0]]); L([[-0.18, 0.2], [0.06, 0.2]]); }
  if (kind === 'key') { ctx.save(); ctx.lineWidth = s * 0.07; ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(cx - s * 0.22, cy, s * 0.18, 0, Math.PI * 2 * clamp(p)); ctx.stroke(); ctx.restore(); L([[-0.04, 0], [0.46, 0], [0.46, 0.16]]); L([[0.3, 0], [0.3, 0.14]]); }
  if (kind === 'store') { L([[-0.46, -0.1], [-0.38, -0.4], [0.38, -0.4], [0.46, -0.1], [-0.46, -0.1]]); box(-0.4, -0.1, 0.8, 0.52, 0.02); L([[-0.12, 0.42], [-0.12, 0.12], [0.12, 0.12], [0.12, 0.42]]); }
}

// ---------- images: plates (full frame), blurred plates (built once), cutouts ----------
function cover(img, zoom = 1, fx = 0.5, fy = 0.5, dx = 0, dy = 0) {
  const s = Math.max(W / img.width, H / img.height) * zoom, w = img.width * s, h = img.height * s;
  ctx.drawImage(img, W / 2 - w * fx + dx, H / 2 - h * fy + dy, w, h);
}
function bake(img, filter, zoom = 1.08) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.filter = filter; const s = Math.max(W / img.width, H / img.height) * zoom, w = img.width * s, h = img.height * s;
  g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); return c;
}
// a cutout or card image placed by its centre, with a spring entrance from an offset, a soft drop shadow
function place(img, cx, cy, w, p, { dx = 0, dy = 120, rot = 0, sc = 0.85, shadow = 0.45, alpha = 1, radius = 0, clipH = null } = {}) {
  if (p <= 0) return;
  const h = clipH || w * img.height / img.width;
  ctx.save(); ctx.translate(cx + (1 - p) * dx, cy + (1 - p) * dy); ctx.rotate(rot * (1 - p)); const s = mix(sc, 1, p); ctx.scale(s, s);
  ctx.globalAlpha *= clamp(p * 1.4) * alpha;
  if (shadow > 0) { ctx.shadowColor = `rgba(0,8,20,${shadow})`; ctx.shadowBlur = 50; ctx.shadowOffsetY = 26; }
  if (radius > 0) { rr(-w / 2, -h / 2, w, h, radius); ctx.save(); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore(); ctx.shadowColor = 'transparent'; ctx.clip(); }
  ctx.drawImage(img, -w / 2, -h / 2, w, w * img.height / img.width);
  ctx.restore();
}
// a navy scrim behind the Hebrew text column (right side) on photo scenes
function scrim(a = 0.85, from = 0.42) {
  const g = ctx.createLinearGradient(W, 0, W * from, 0);
  g.addColorStop(0, `rgba(0,23,46,${a})`); g.addColorStop(0.55, `rgba(0,23,46,${a * 0.75})`); g.addColorStop(1, 'rgba(0,23,46,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// white chip that springs in (orders, sales)
function chip(str, sub, x, y, t, t0, w = 380) {
  const p = sp(t, t0, POP); if (p <= 0) return;
  ctx.save(); ctx.translate(x + (1 - p) * 90, y); ctx.globalAlpha *= clamp(p * 1.6);
  ctx.shadowColor = 'rgba(0,8,20,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  rr(-w, -46, w, 92, 20); ctx.fillStyle = C.white; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(-48, 0, 25, 0, 7); ctx.fillStyle = C.sky; ctx.fill(); check(-48, 1, 24, 1, C.white, 5);
  T(str, -88, sub ? -2 : 13, 36, 800, C.navy, 'right'); if (sub) T(sub, -88, 30, 24, 500, C.dim, 'right');
  ctx.restore();
}
// a trust popup: white card, sky icon disc, one line; springs up with overshoot
function trust(str, ic, cx, cy, p, size = 40, sub = null) {
  if (p <= 0) return;
  const w = tw(str, size, 800) + 190, h = sub ? size * 3.1 : size * 2.4;
  ctx.save(); ctx.translate(cx, cy + (1 - p) * 60); ctx.scale(mix(0.7, 1, p), mix(0.7, 1, p)); ctx.globalAlpha *= clamp(p * 1.5);
  ctx.shadowColor = 'rgba(0,8,20,0.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  rr(-w / 2, -h / 2, w, h, 26); ctx.fillStyle = C.white; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(w / 2 - 62, 0, 38, 0, 7); ctx.fillStyle = C.sky; ctx.fill();
  icon(ic, w / 2 - 62, 0, 46, 1, C.white);
  T(str, w / 2 - 118, sub ? -4 : size * 0.36, size, 800, C.navy, 'right');
  if (sub) T(sub, w / 2 - 118, size * 1.05, size * 0.6, 500, C.dim, 'right');
  ctx.restore();
}
function exampleTag(x, y, p) { pill('חנות לדוגמה', x, y, 24, p, 'rgba(0,23,46,0.82)', C.mist, 0.7); }

// ---------- scene cuts (word indices) ----------
const K = { dream: 0, second: 12, chores: 20, quit: 37, brand: 43, s1: 50, s2: 68, s2b: 82, s2c: 87, s3: 91, reframe: 101, job: 116, cta: 122 };
const CUT = [0, S(K.second), S(K.chores), S(K.quit), S(K.brand), S(K.s1), S(K.s2), S(K.s2b) - 0.05, S(K.s2c) - 0.08, S(K.s3), S(K.reframe), S(K.job), S(K.cta), T_END];
const RX = 1800;

// 1. dream: the store already exists. Blurred plate, the laptop layer flies up out of it, orders arrive.
function sceneDream(t) {
  const lp = sp(t, -0.05, SOFT);
  ctx.save(); ctx.globalAlpha = clamp(t * 4); ctx.drawImage(BL.store, 0, 0); ctx.restore();
  ctx.save(); ctx.translate(0, 0);
  const z = mix(1.18, 1.0, lp);
  ctx.translate(700, 560); ctx.scale(z * 0.78, z * 0.78); ctx.translate(-700, -560);
  ctx.globalAlpha = clamp(lp * 1.8);
  ctx.shadowColor = 'rgba(0,8,20,0.6)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
  const s = W / IMG.storeCut.width; ctx.drawImage(IMG.storeCut, 700 - IMG.storeCut.width * s * 0.53, 560 - IMG.storeCut.height * s * 0.5 + (1 - lp) * 160, IMG.storeCut.width * s, IMG.storeCut.height * s);
  ctx.restore();
  exampleTag(330, 940, sp(t, 1.2));
  scrim(0.9, 0.5);
  T('תדמיינו', RX, 250, 66, 800, C.sky, 'right', sp(t, 0.0), true);
  rise('חנות אונליין', RX, 380, 126, t, S(3) - 0.06);
  rise('שמישהו אחר בנה', RX, 510, 92, t, S(5) - 0.05, 700, C.mist);
  rise('ומנהל בשבילכם', RX, 626, 92, t, S(9) - 0.05, 800, C.sky);
  chip('הזמנה חדשה', 'Renewal Serum', 1800, 760, t, S(9) + 0.05);
  chip('הזמנה חדשה', 'Night Cream', 1800, 870, t, S(10) + 0.05);
  chip('נשלחה ללקוח', 'Renewal Serum', 1800, 980, t, S(11) + 0.15);
}
// 2. the second job: a real night desk, stamp
function sceneSecond(t) {
  const t0 = S(K.second), q = (t - t0) / (CUT[2] - t0);
  cover(IMG.pain, mix(1.12, 1.2, smooth(q)), 0.45, 0.5);
  scrim(0.88, 0.45);
  T('בדרך כלל', RX, 330, 56, 700, C.mist, 'right', sp(t, t0), true);
  rise('חנות אונליין', RX, 460, 116, t, S(15) - 0.05);
  const p = sp(t, S(18) - 0.04, SNAP);
  if (p > 0) {
    ctx.save(); ctx.translate(1420, 640); ctx.rotate(-0.06); ctx.scale(mix(1.8, 1, p), mix(1.8, 1, p)); ctx.globalAlpha *= clamp(p * 2);
    const w = tw('= עבודה שנייה', 108, 800) + 80;
    rr(-w / 2, -82, w, 158, 18); ctx.fillStyle = 'rgba(0,23,46,0.6)'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = C.sky; ctx.stroke();
    T('= עבודה שנייה', 0, 36, 108, 800, C.white, 'center'); ctx.restore();
  }
}
const CHORES = [
  { w: 20, label: 'בונים את האתר', ic: 'site' }, { w: 23, label: 'מחפשים ספקים', ic: 'truck' },
  { w: 25, label: 'כותבים מודעות', ic: 'mega' }, { w: 27, label: 'עונים ללקוחות', ic: 'angry' },
  { w: 31, label: 'שולחים הזמנות', ic: 'box' },
];
function choreCard(c, x, y, cw, ch, t, t0, grey = 0) {
  dbox(x, y, cw, ch, 22, ramp(t, t0, 0.4), sp(t, t0 + 0.25, SOFT), grey ? '#1C2A38' : 'rgba(10,42,74,0.92)', grey ? C.grey : C.sky, 3);
  icon(c.ic, x + cw / 2, y + ch * 0.38, ch * 0.4, ramp(t, t0 + 0.08, 0.5), grey ? C.grey : (c.ic === 'angry' ? C.ice : C.sky));
  T(c.label, x + cw / 2, y + ch - 42, 40, 700, grey ? C.mist : C.white, 'center');
}
// 3. the five chores, one per word, over the same night desk (blurred), then a month ticks off
function sceneChores(t) {
  ctx.drawImage(BL.pain, 0, 0);
  ctx.fillStyle = 'rgba(0,23,46,0.45)'; ctx.fillRect(0, 0, W, H);
  T('ובנוסף לעבודה שלכם', RX, 170, 54, 800, C.mist, 'right', sp(t, S(20) - 0.2), true);
  const cw = 310, gap = 28, x0 = W / 2 + (5 * cw + 4 * gap) / 2;
  CHORES.forEach((c, i) => {
    const t0 = S(c.w) - 0.12, p = sp(t, t0, POP); if (p <= 0) return;
    const x = x0 - (i + 1) * cw - i * gap, y = 250;
    ctx.save(); ctx.translate(x + cw / 2, y + 190 + (1 - p) * 70); ctx.rotate((1 - p) * (i % 2 ? 0.08 : -0.08)); ctx.globalAlpha *= clamp(p * 1.5);
    choreCard(c, -cw / 2, -190, cw, 380, t, t0); ctx.restore();
  });
  const d0 = S(34) - 0.1;
  if (t >= d0 - 0.2) {
    T('כל יום מחדש', RX, 790, 72, 800, C.sky, 'right', sp(t, d0), true);
    for (let i = 0; i < 30; i++) {
      const c = i % 15, r = Math.floor(i / 15), x = 1290 - (c + 1) * 70, y = 730 + r * 76, ti = d0 + 0.05 + i * 0.022;
      dbox(x, y, 58, 58, 10, ramp(t, ti, 0.2), sp(t, ti + 0.08, POP) * 0.95, C.panel2, C.sky, 2);
      check(x + 29, y + 29, 30, ramp(t, ti + 0.1, 0.15), C.ice, 5);
    }
  }
}
// 4. it wears you out: the desk drains to grey, the chores slump
function sceneQuit(t) {
  const t0 = S(K.quit), g = ramp(t, t0, 0.6);
  ctx.drawImage(BL.pain, 0, 0); ctx.save(); ctx.globalAlpha = g; ctx.drawImage(BL.painGrey, 0, 0); ctx.restore();
  ctx.fillStyle = `rgba(0,23,46,${mix(0.45, 0.6, g)})`; ctx.fillRect(0, 0, W, H);
  CHORES.forEach((c, i) => {
    const p = ramp(t, t0 + i * 0.06, 0.7), x = mix(300 + i * 150, 560 + (i % 2) * 70, p), y = mix(420, 760 - i * 56, p);
    ctx.save(); ctx.translate(x, y); ctx.rotate(mix(0, (i % 2 ? 0.16 : -0.12) * (1 + i * 0.3), p));
    dbox(-180, -48, 360, 96, 16, 1, 1, '#1C2A38', C.grey, 3); T(c.label, 0, 14, 38, 700, C.mist, 'center', 0.9); ctx.restore();
  });
  rise('זה מתיש.', RX, 440, 140, t, t0);
  rise('ורוב האנשים', RX, 600, 88, t, S(39), 700, C.mist);
  rise('פשוט מוותרים.', RX, 712, 88, t, S(41), 800, C.white);

// ---------- camera: hook punch, punch-ins on key words, shakes on stamps, whip pans at cuts ----------
const PUNCH = [[0, 0.14], [S(18), 0.06], [S(37), 0.05], [S(52), 0.04], [S(67), 0.05], [S(77), 0.07], [S(83), 0.04], [S(93), 0.04], [S(99), 0.05], [S(105), 0.05], [S(126), 0.04]];
const SHAKE = [S(18), S(67), S(77), S(99), S(105) + 0.05];
const WHIP = new Set([1, 2, 5, 7, 8, 9, 11, 12]);        // cut indices that whip (the others hard-cut or flash)
function camera(t) {
  let z = 1;
  for (const [t0, a] of PUNCH) { const d = t - t0; if (d >= 0 && d < 1.2) z += a * Math.exp(-d * 4.5) * (t0 === 0 ? 1 : Math.min(1, d * 18)); }
  let x = 0, y = 0;
  for (const t0 of SHAKE) { const d = t - t0; if (d >= 0 && d < 0.45) { const a = 14 * Math.exp(-d * 9); x += a * Math.sin(d * 71); y += a * Math.cos(d * 53); } }
  return { z, x, y };
}

// ---------- frame ----------
function drawScene(k, t, dx, blur) {
  const cam = camera(t);
  ctx.save();
  if (blur > 0.5) ctx.filter = `blur(${blur.toFixed(1)}px)`;
  ctx.translate(960 + cam.x + dx, 540 + cam.y); ctx.scale(cam.z, cam.z); ctx.translate(-960, -540);
  ground(t); SCENES[k](t);
  ctx.restore();
}
function seek(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  let k = 0; while (k < CUT.length - 2 && t >= CUT[k + 1]) k++;
  const a = CUT[k], b = CUT[k + 1], HW = 0.13;
  // whip pan: the outgoing scene accelerates off to the left with blur, the next one arrives from the right
  if (k + 1 < SCENES.length && WHIP.has(k + 1) && t > b - HW) { const p = smooth((t - (b - HW)) / HW); drawScene(k, t, -p * 700, p * 26); }
  else if (k > 0 && WHIP.has(k) && t < a + HW) { const p = 1 - smooth((t - a) / HW); drawScene(k, t, p * 700, p * 26); }
  else drawScene(k, t, 0, 0);
  // brand stamp: the M mark, bottom-left, from the brand reveal on
  if (k >= 5 && k < SCENES.length - 1) { ctx.save(); ctx.globalAlpha = 0.9; ctx.drawImage(MARK, 60, 980, 68, 52); ctx.restore(); }
}
