    <script>
      // Fonts first (Hebrew and Latin subsets), then build; the timeline is registered only once it is complete,
      // and the runtime holds render-ready on the build (window.__hf.buildReady), so its length is known in time.
      var probes = ['700 96px "Frank Ruhl Libre"', '900 112px "Frank Ruhl Libre"', '500 56px "Heebo"', '700 52px "Heebo"', '400 44px "Heebo"'];
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["film"] = Promise.all(probes.map(function (f) { return document.fonts.load(f, 'אב 8?'); })).then(function () {
        var tl = gsap.timeline({ paused: true });
        SS.main.build(document.getElementById("root"), tl);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      });
    </script>
